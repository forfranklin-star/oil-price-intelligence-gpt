app:
  timezone: Asia/Shanghai
  rolling_window_days: 180
  forecast_short_days: 14
  forecast_medium_days: 90
  random_seed: 42

data:
  market_history_days: 730
  request_timeout_seconds: 15
  request_delay_seconds: 0.8
  user_agent: "OilPriceIntelligence/1.0 (+public-research-dashboard)"
  yahoo_chart_base: "https://query1.finance.yahoo.com/v8/finance/chart"
  fred_csv_base: "https://fred.stlouisfed.org/graph/fredgraph.csv"
  google_news_rss: "https://news.google.com/rss/search"
  # 可选：接入你自己的国内柴油 CSV/API。CSV 最少包含 date,price 两列。
  china_diesel_csv_url: ""

symbols:
  wti: "CL=F"
  brent: "BZ=F"
  dxy: "DX-Y.NYB"
  cnyusd: "CNY=X"

fred_series:
  us10y: "DGS10"
  cpi: "CPIAUCSL"
  nonfarm: "PAYEMS"
  broad_usd: "DTWEXBGS"

weights:
  manual_prior_strength: 0.35
  manual:
    geopolitical_risk: 0.24
    usd_return: -0.16
    us10y_change: -0.10
    cpi_surprise_proxy: -0.07
    payroll_momentum: 0.06
    institution_score: 0.13
    brent_return: 0.18
    momentum_5d: 0.06

news:
  queries:
    - "oil OPEC Russia Iran sanctions crude"
    - "WTI Brent oil supply demand EIA IEA OPEC"
    - "Red Sea oil tanker attack energy"
    - "Goldman JPMorgan UBS oil price forecast"
